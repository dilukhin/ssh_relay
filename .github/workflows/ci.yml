name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-control-plane:
    name: Windows control-plane
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Paramiko
        run: python -m pip install --disable-pip-version-check paramiko

      - name: Проверить синтаксис
        run: >-
          python -m py_compile
          ssh_relay.py
          ssh_relay_core.py
          ssh_relay_session.py
          ssh_relay_jobs.py
          ssh_relay_transfers.py
          tests/daemon_fake_runner.py
          tests/daemon_exec_fake_runner.py
          tests/daemon_security_fake_runner.py
          tests/daemon_real_ssh_runner.py
          tests/localhost_ssh_server.py
          tests/test_session_safety.py
          tests/test_session_lifecycle.py
          tests/test_daemon_session_integration.py
          tests/test_core_exec_reconnect.py
          tests/test_security.py
          tests/test_security_redaction.py
          tests/test_real_ssh_integration.py
          tests/test_real_sftp_integration.py
          tests/test_cli_contract.py
          tests/test_protocol_hardening.py
          tests/test_daemon_busy_shutdown.py
          tests/test_transfers.py

      - name: Проверить session control-plane
        run: python -m unittest discover -s tests -p "test_*session*.py" -v

      - name: Проверить exec и reconnect
        run: python -m unittest discover -s tests -p "test_core*.py" -v

      - name: Проверить security-контракт
        run: python -m unittest discover -s tests -p "test_security*.py" -v

      - name: Проверить настоящий loopback SSH
        run: python -m unittest discover -s tests -p "test_real_ssh_integration.py" -v

      - name: Проверить настоящий loopback SFTP
        run: python -m unittest discover -s tests -p "test_real_sftp_integration.py" -v

      - name: Проверить публичный CLI-контракт
        run: python -m unittest discover -s tests -p "test_cli_contract.py" -v

      - name: Проверить hardening локального протокола
        run: python -m unittest discover -s tests -p "test_protocol_hardening.py" -v

      - name: Проверить stop/status при занятом daemon
        run: python -m unittest discover -s tests -p "test_daemon_busy_shutdown.py" -v

      - name: Проверить transfer client logic
        run: python -m unittest discover -s tests -p "test_transfers.py" -v

  ubuntu-tests:
    name: Ubuntu full tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Paramiko и coverage.py
        run: python -m pip install --disable-pip-version-check paramiko coverage

      - name: Проверить синтаксис
        run: >-
          python -m py_compile
          ssh_relay.py
          ssh_relay_core.py
          ssh_relay_session.py
          ssh_relay_jobs.py
          ssh_relay_transfers.py
          tests/daemon_fake_runner.py
          tests/daemon_exec_fake_runner.py
          tests/daemon_security_fake_runner.py
          tests/daemon_real_ssh_runner.py
          tests/localhost_ssh_server.py
          tests/test_session_safety.py
          tests/test_session_lifecycle.py
          tests/test_daemon_session_integration.py
          tests/test_core_exec_reconnect.py
          tests/test_security.py
          tests/test_security_redaction.py
          tests/test_real_ssh_integration.py
          tests/test_real_sftp_integration.py
          tests/test_cli_contract.py
          tests/test_protocol_hardening.py
          tests/test_daemon_busy_shutdown.py
          tests/test_jobs.py
          tests/test_transfers.py

      - name: Выполнить полный набор тестов с branch coverage
        run: >-
          python -m coverage run
          --branch
          --include="ssh_relay*.py"
          -m unittest discover -s tests -v

      - name: Показать baseline coverage production-модулей
        run: python -m coverage report --show-missing
