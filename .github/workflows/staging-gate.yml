name: Полная приёмка staging 0.7.0

on:
  push:
    branches:
      - agent/0.7-integration-staging

permissions:
  contents: write

jobs:
  protocol-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Проверить синтаксис
        run: python -m py_compile ssh_relay.py tests/test_machine_protocol.py tests/test_local_tcp_protocol.py tests/test_reconnect_protocol.py tests/test_transfer_protocol.py tests/test_multi_session_protocol.py tests/test_real_ssh_reconnect.py tests/test_stdio_utf8.py
      - name: Проверить машинный протокол
        env:
          PYTHONUTF8: '1'
        run: python tests/test_machine_protocol.py
      - name: Проверить UTF-8 вывод CLI
        run: python tests/test_stdio_utf8.py
      - name: Проверить локальный TCP-протокол
        run: python tests/test_local_tcp_protocol.py
      - name: Проверить reconnect
        run: python tests/test_reconnect_protocol.py
      - name: Проверить upload и download
        run: python tests/test_transfer_protocol.py
      - name: Проверить две именованные сессии
        run: python tests/test_multi_session_protocol.py

  real-paramiko-reconnect:
    name: Реальный Paramiko + локальный sshd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости теста
        run: |
          python -m pip install --disable-pip-version-check paramiko
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client sudo
      - name: Подготовить локальный SSH-сервер
        run: |
          set -eu
          sudo mkdir -p /run/sshd
          ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh_relay_host_key
          ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh_relay_client_key
          sudo useradd -m -s /bin/bash relaytest
          echo 'relaytest:relaypass' | sudo chpasswd
          sudo usermod -aG sudo relaytest
          sudo install -d -m 700 -o relaytest -g relaytest /home/relaytest/.ssh
          sudo install -m 600 -o relaytest -g relaytest /tmp/ssh_relay_client_key.pub /home/relaytest/.ssh/authorized_keys
          cat >/tmp/ssh_relay_sshd_config <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /tmp/ssh_relay_host_key
          PidFile /tmp/ssh_relay_sshd.pid
          AuthorizedKeysFile .ssh/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          AllowUsers relaytest
          StrictModes yes
          LogLevel ERROR
          Subsystem sftp internal-sftp
          EOF
          sudo /usr/sbin/sshd -f /tmp/ssh_relay_sshd_config -E /tmp/ssh_relay_sshd.log
      - name: Проверить реальный reconnect
        env:
          SSH_RELAY_REAL_SSH_TEST: '1'
          SSH_RELAY_TEST_SSH_HOST: 127.0.0.1
          SSH_RELAY_TEST_SSH_PORT: '2222'
          SSH_RELAY_TEST_USER: relaytest
          SSH_RELAY_TEST_IDENTITY: /tmp/ssh_relay_client_key
        run: python tests/test_real_ssh_reconnect.py
      - name: Показать sshd log при ошибке
        if: failure()
        run: sudo cat /tmp/ssh_relay_sshd.log || true

  cleanup-staging:
    name: Очистить staging после полной приёмки
    needs: [protocol-tests, real-paramiko-reconnect]
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.7-integration-staging
          fetch-depth: 0
      - name: Удалить временные staging-файлы
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .integration
          git rm .github/workflows/integrate-0.7-staging.yml
          git rm .github/workflows/staging-gate.yml
          git commit -m "сделано: staging 0.7.0 прошёл полную автоматическую приёмку"
          git push origin HEAD:agent/0.7-integration-staging
