name: Сборка staging 0.7.0

on:
  push:
    branches:
      - agent/0.7-integration-staging

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Восстановить и проверить payload
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/payload.* | base64 -d > /tmp/payload.tar.gz
          echo "68e15b39e0963d7f5ab86e350549d52de70ef1a308550f000beb9542a9445e95  /tmp/payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/payload.tar.gz
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "ssh_relay.py": "99c896c556b3defbc37c938f6f68fa5d13bc73b1fe9ad90369201f0b8f175954",
              "README.md": "e1f82da66be7ab4d91be0e31691f87ed2394244656dd40b7ff5afad3bdfc20df",
              "tests/test_local_tcp_protocol.py": "319fabace0e4df07eeadfef87a947cc2b2d7743be2cb89547a5ed243ebd8fc2b",
              "tests/test_reconnect_protocol.py": "a99a163588f8d42381c6ac78953ab78ab82aeaee4f9e64ae21b37a3b1b22e5fe",
              "tests/test_transfer_protocol.py": "84057689becb6babd6a261e199d07bfbca39911402c5448cfd1172d76fe11ada",
              "tests/test_multi_session_protocol.py": "7aad2b29e2768c66f65a693cf9928516dfc9da0feaf3cbbf392c742b3203d119",
              "tests/test_real_ssh_reconnect.py": "84d2fcd0320d308484870249dd443e3acef30fae9e27aa71cc79eeb484bcd3b7",
          }
          for path, wanted in expected.items():
              got = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got != wanted:
                  raise SystemExit(f"{path}: SHA-256 {got} != {wanted}")
          PY
      - name: Исправить UTF-8 вывод CLI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("ssh_relay.py")
          text = p.read_text(encoding="utf-8")
          old = '''\ndef main() -> int:\n    parser = build_parser()\n    args = parser.parse_args()\n    return int(args.handler(args))\n'''
          new = '''\ndef configure_stdio_utf8() -> None:\n    """Настраивает стабильный UTF-8 вывод CLI, включая перенаправленный stdout/stderr в Windows."""\n    for stream in (sys.stdout, sys.stderr):\n        reconfigure = getattr(stream, "reconfigure", None)\n        if not callable(reconfigure):\n            continue\n        try:\n            reconfigure(encoding="utf-8", errors="replace")\n        except (OSError, ValueError):\n            # Нестандартный поток может не поддерживать перенастройку;\n            # основная логика CLI при этом остаётся доступной.\n            pass\n\n\ndef main() -> int:\n    configure_stdio_utf8()\n    parser = build_parser()\n    args = parser.parse_args()\n    return int(args.handler(args))\n'''
          if "def configure_stdio_utf8()" not in text:
              if old not in text:
                  raise SystemExit("Не найден ожидаемый фрагмент main()")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          wanted = "63db95d0c09e40dfa4cc2774edb21949d57c4b010e3ba338f7faba49fa4db5ee"
          if got != wanted:
              raise SystemExit(f"ssh_relay.py после UTF-8 fix: SHA-256 {got} != {wanted}")
          PY
      - name: Локальные автоматические тесты
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ssh_relay.py tests/test_machine_protocol.py tests/test_local_tcp_protocol.py tests/test_reconnect_protocol.py tests/test_transfer_protocol.py tests/test_multi_session_protocol.py tests/test_real_ssh_reconnect.py
          python tests/test_machine_protocol.py
          PYTHONIOENCODING=cp1252 python tests/test_machine_protocol.py
          python tests/test_local_tcp_protocol.py
          python tests/test_reconnect_protocol.py
          python tests/test_transfer_protocol.py
          python tests/test_multi_session_protocol.py
      - name: Зафиксировать проверенное дерево staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssh_relay.py README.md tests/test_local_tcp_protocol.py tests/test_reconnect_protocol.py tests/test_transfer_protocol.py tests/test_multi_session_protocol.py tests/test_real_ssh_reconnect.py
          if git diff --cached --quiet; then
            echo "Проверенное дерево уже зафиксировано."
          else
            git commit -m "исправлено: UTF-8 вывод CLI в версии 0.7.0"
            git push origin HEAD:agent/0.7-integration-staging
          fi
